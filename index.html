<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Void</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }
        
        body {
            background-color: #020202;
            color: #1a0000; /* لون أحمر غامق جداً قريب للأسود */
            font-family: 'Courier Prime', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container { text-align: center; }

        h1 {
            font-size: clamp(1.2rem, 6vw, 2.5rem);
            letter-spacing: 15px;
            margin-bottom: 70px;
            color: #3d0000; /* لون دموي جاف */
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(138, 3, 3, 0.2);
            animation: flicker 4s infinite;
        }

        .countdown-wrapper {
            display: flex;
            gap: clamp(15px, 5vw, 40px);
            justify-content: center;
        }

        .number {
            display: block;
            font-size: clamp(2.5rem, 9vw, 5rem);
            font-weight: 700;
            color: #5a0000;
            line-height: 1;
            margin-bottom: 10px;
            filter: blur(0.5px);
        }

        .label {
            font-size: 0.6rem;
            color: #222;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.2; }
        }

        audio { display: none; }
    </style>
</head>
<body onclick="playAudio()">

    <div class="container">
        <h1>THE VOID AWAITS</h1>
        
        <div class="countdown-wrapper">
            <div class="time-box"><span class="number" id="days">00</span><span class="label">Days</span></div>
            <div class="time-box"><span class="number" id="hours">00</span><span class="label">Hours</span></div>
            <div class="time-box"><span class="number" id="minutes">00</span><span class="label">Minutes</span></div>
            <div class="time-box"><span class="number" id="seconds">00</span><span class="label">Seconds</span></div>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="now.mp3" type="audio/mpeg">
    </audio>

    <script>
        function playAudio() { document.getElementById("bgMusic").play(); }

        function updateCountdown() {
            const targetDate = new Date("May 10, 2026 00:00:00").getTime();
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff > 0) {
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('days').textContent = String(d).padStart(2, '0');
                document.getElementById('hours').textContent = String(h).padStart(2, '0');
                document.getElementById('minutes').textContent = String(m).padStart(2, '0');
                document.getElementById('seconds').textContent = String(s).padStart(2, '0');
            }
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
