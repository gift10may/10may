<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE INEVITABLE DECAY</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #000;
            color: #1a0000;
            font-family: 'Courier Prime', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: crosshair;
        }

        /* شاشة البداية المرعبة */
        #overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 2s ease;
        }

        #overlay p {
            color: #400; /* أحمر دموي غامق جداً */
            font-size: clamp(1rem, 4vw, 1.5rem);
            letter-spacing: 6px;
            text-align: center;
            margin-bottom: 40px;
            padding: 0 20px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.1);
        }

        #startBtn {
            background: transparent;
            color: #222;
            border: 1px solid #111;
            padding: 12px 35px;
            font-family: 'Courier Prime', monospace;
            font-size: 0.8rem;
            letter-spacing: 5px;
            cursor: pointer;
            transition: all 0.8s ease;
            text-transform: uppercase;
        }

        #startBtn:hover {
            color: #ff0000;
            border-color: #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
            text-shadow: 0 0 5px #ff0000;
        }

        /* حاوية العداد التنازلي */
        .container { 
            text-align: center; 
            opacity: 0; 
            transition: opacity 4s ease;
        }

        h1 {
            font-size: clamp(1.2rem, 6vw, 2.5rem);
            letter-spacing: 15px;
            margin-bottom: 70px;
            color: #3d0000;
            text-transform: uppercase;
            animation: flicker 6s infinite ease-in-out;
            text-shadow: 0 0 15px rgba(138, 3, 3, 0.3);
        }

        .countdown-wrapper {
            display: flex;
            gap: clamp(15px, 5vw, 40px);
            justify-content: center;
        }

        .number {
            display: block;
            font-size: clamp(2.8rem, 10vw, 5.5rem);
            font-weight: 700;
            color: #600; /* لون أحمر باهت */
            line-height: 1;
            margin-bottom: 10px;
            filter: blur(0.4px);
        }

        .label {
            font-size: 0.6rem;
            color: #222;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* حركة الوميض المزعجة */
        @keyframes flicker {
            0%, 10%, 12%, 20%, 22%, 55%, 57%, 100% { opacity: 1; }
            11%, 21%, 56% { opacity: 0.1; }
        }

        audio { display: none; }
    </style>
</head>
<body>

    <!-- الشاشة الافتتاحية -->
    <div id="overlay">
        <p>YOU SHOULDN'T HAVE CLICKED...<br>BUT IT'S TOO LATE NOW.</p>
        <button id="startBtn" onclick="startExperience()">Continue</button>
    </div>

    <!-- محتوى العداد -->
    <div class="container" id="mainContent">
        <h1>THE VOID AWAITS</h1>
        <div class="countdown-wrapper">
            <div class="time-box"><span class="number" id="days">00</span><span class="label">Days</span></div>
            <div class="time-box"><span class="number" id="hours">00</span><span class="label">Hours</span></div>
            <div class="time-box"><span class="number" id="minutes">00</span><span class="label">Minutes</span></div>
            <div class="time-box"><span class="number" id="seconds">00</span><span class="label">Seconds</span></div>
        </div>
    </div>

    <!-- ملف الصوت now.mp3 -->
    <audio id="bgMusic" loop>
        <source src="now.mp3" type="audio/mpeg">
    </audio>

    <script>
        function startExperience() {
            const audio = document.getElementById("bgMusic");
            audio.play().catch(e => console.log("Interaction required for audio."));

            const overlay = document.getElementById("overlay");
            overlay.style.opacity = "0";
            
            setTimeout(() => {
                overlay.style.display = "none";
                document.getElementById("mainContent").style.opacity = "1";
            }, 2000);
        }

        function updateCountdown() {
            // التاريخ المستهدف هو 10 مايو 2026
            const targetDate = new Date("May 10, 2026 00:00:00").getTime();
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff > 0) {
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('days').textContent = String(d).padStart(2, '0');
                document.getElementById('hours').textContent = String(h).padStart(2, '0');
                document.getElementById('minutes').textContent = String(m).padStart(2, '0');
                document.getElementById('seconds').textContent = String(s).padStart(2, '0');
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
